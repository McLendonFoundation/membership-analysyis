# Runs the test suite on every push and pull request. Uses synthetic data only.
# Author: Ishita Tibrewal
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assoc-pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assoc-pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
